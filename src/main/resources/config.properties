# Application Configuration

# Locale setting (e.g., en, es)
locale=en

# Business Logic Configuration (potentially for RMI or remote access, less relevant if local)
businessLogic.node=localhost
businessLogic.port=1099
businessLogic.name=BusinessLogicService
businessLogic.isLocal=true

# Data Access Configuration
# Node and port are relevant only if dataAccess.isLocal=false
dataAccess.node=localhost
# dataAccess.port= # Port for remote ObjectDB if needed
dataAccess.isLocal=true


# dataBase.openMode: 'open' to use existing DB, 'initialize' to clear and recreate with test data
dataBase.openMode=initialize
# User/Password usually not needed for local ObjectDB file access
dataBase.user=
dataBase.password= 

# Logging Configuration
# Valid levels: OFF, FATAL, ERROR, WARN, INFO, DEBUG, TRACE, ALL
logging.level=DEBUG 